<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | VeriHome Inspection Portal</title>
  <meta name="description" content="Reset your VeriHome client portal password to access your inspection reports and appointments.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="alternate icon" type="image/png" href="assets/images/favicon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="vh-auth-body">

  <!-- Floating Theme & RTL Controls -->
  <div class="vh-auth-controls">
    <button class="btn btn-nav-control" id="vhThemeToggle" type="button" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
      <i class="bi bi-moon-stars-fill text-primary"></i>
    </button>
    <button class="btn btn-nav-control" id="vhRtlToggle" type="button" title="Toggle RTL/LTR" aria-label="Toggle RTL">
      <span class="rtl-text">RTL</span>
    </button>
  </div>

  <!-- Forgot Password Card Section (Centered in Viewport, No Footer) -->
  <main class="vh-auth-main">
    <div class="container">
      <div class="vh-auth-card text-center">
        
        <!-- VeriHome Brand Logo (Consistent gold-gradient shield icon and wordmark) -->
        <a class="vh-brand mx-auto mb-3" href="index.html">
          <span class="vh-brand-icon"><i class="bi bi-shield-check"></i></span>
          <span>Veri<span class="text-warning">Home</span></span>
        </a>

        <h2 class="vh-auth-title">Forgot your password?</h2>
        <p class="vh-auth-subtitle">Enter the email linked to your account and we will send a reset link.</p>

        <!-- Inline Feedback Message -->
        <div id="forgotFeedback" class="vh-auth-alert" style="display: none;" role="alert"></div>

        <form id="forgotForm" novalidate onsubmit="handleForgotSubmit(event)">
          <div class="vh-auth-group">
            <label class="vh-auth-label" for="forgotEmail">Email address</label>
            <div class="vh-auth-input-wrap">
              <span class="vh-auth-input-icon"><i class="bi bi-envelope"></i></span>
              <input type="email" id="forgotEmail" class="vh-auth-input" placeholder="Enter your email address" value="" autocomplete="email">
            </div>
          </div>

          <button type="submit" class="btn vh-auth-btn w-100 py-3 mb-4">
            <i class="bi bi-key-fill me-1"></i>Send Reset Link
          </button>

          <div class="text-center small">
            <span class="text-muted">Remembered it?</span> <a href="login.html" class="vh-auth-link fw-semibold ms-1">Back to login</a>
          </div>
        </form>

      </div>
    </div>
  </main>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function handleForgotSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();
      const feedbackEl = document.getElementById('forgotFeedback');
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!email) {
        feedbackEl.className = 'vh-auth-alert vh-auth-alert-danger';
        feedbackEl.innerHTML = '<i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i><span>Please enter your email address.</span>';
        feedbackEl.style.display = 'flex';
        return;
      }

      if (!emailRegex.test(email)) {
        feedbackEl.className = 'vh-auth-alert vh-auth-alert-danger';
        feedbackEl.innerHTML = '<i class="bi bi-exclamation-circle-fill flex-shrink-0"></i><span>Please enter a valid email address.</span>';
        feedbackEl.style.display = 'flex';
        return;
      }

      feedbackEl.className = 'vh-auth-alert vh-auth-alert-success';
      feedbackEl.innerHTML = '<i class="bi bi-check-circle-fill flex-shrink-0"></i><span>Reset instructions have been dispatched to your email.</span>';
      feedbackEl.style.display = 'flex';
    }
  </script>
</body>
</html>
